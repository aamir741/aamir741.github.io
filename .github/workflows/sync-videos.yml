name: Sync YouTube videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh video sections from the public YouTube feed
        run: python3 .github/scripts/sync_videos.py
      - name: Commit and rebuild the site if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "mirakx-sync"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Sync YouTube videos"
            git push
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          else
            echo "No changes"
          fi
